name: ps-spec
version: 1
description: ps-spec workflow - one epic per change; proposal → specs → design → tasks → test-plan, then branch, code, test, doc, close
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why this epic exists and what it changes (maps 1:1 to an epic in EPICS.md)
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.
      This change implements exactly one epic from EPICS.md at the repo root -
      read that epic (goal, user stories, scope, out-of-scope) first and carry
      its id and stories into the proposal so the chain PRD → epic → change
      stays traceable.

      Sections:
      - **Epic**: `E0N - <title>` and a link to the EPICS.md entry.
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **User Stories**: copy the epic's stories (As a / I want / So that) with their acceptance criteria. Specs and the test plan are derived from these.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related. Reuse an existing capability's exact path instead of
      introducing a near-duplicate name. Read each relevant spec in full with
      `openspec show "<spec-id>" --type spec` before deciding what changes.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (scaffolding epic, pure refactor, tooling, docs).
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Behavior contract (delta specs) for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan. Derive
      requirements from the proposal's user stories: each acceptance criterion
      should be traceable to at least one scenario.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/`.
      - New capabilities: `specs/<capability-path>/spec.md`, kebab-case segments, following the project's existing organization.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/`. Run `openspec list --specs` to confirm before writing the delta.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true`.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters) describing what the capability is
      for. Do NOT add `## Purpose` to a delta for an existing capability.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `openspec/specs/<capability-path>/spec.md`
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data
      ```

      Specs should be testable - each scenario becomes a row in test-plan.md.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: How to implement the change, including the observability plan
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      Include design.md when any apply (otherwise keep it very short):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference ARCHITECTURE.md and the proposal instead of restating them.
      - **Goals / Non-Goals**: design-level boundaries only.
      - **Decisions**: Key technical choices with rationale (why X over Y?) and alternatives considered.
      - **Observability**: how this feature makes itself debuggable - logger names / namespaces, the key log lines at boundaries (entry, exit, errors, external calls), correlation ids, any metrics or health endpoints, and the DEBUG switch. Both an AI agent reading logs and a human on call must be able to follow a request through this feature.
      - **Risks / Trade-offs**: [Risk] → Mitigation
      - **Migration Plan**: deploy and rollback steps, if applicable
      - **Open Questions**: only genuinely deferrable unknowns. If a question would change the specs, the approach, or the tasks, ask the user now instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist, ending with Observability, Tests and Docs groups
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first.

      **IMPORTANT: Follow the template exactly.** The code phase parses the
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under `## N. <Group>` numbered headings
      - Each task MUST be a checkbox: `- [ ] N.M Task description`
      - Tasks small enough to complete in one session, ordered by dependency
      - Each task states how to verify completion (a test, command, observable behavior, or artifact)

      The last three groups are always present, in this order, because they
      are what makes a change closable:
      - `## N. Observability` - implement the logging/tracing decided in design.md
        (logger setup, boundary log lines, correlation ids, DEBUG switch, log
        review). Skip only if design.md explicitly says the change has no runtime code.
      - `## N+1. Tests` - automated tests for each spec scenario, plus a task to
        run the full suite green. Reference test-plan.md.
      - `## N+2. Docs` - write/finalize `<docs-dir>/<feature>.md` including its
        findability header (files, entrypoints, loggers, events, env, specs),
        update the docs index, and refresh `openspec/config.yaml` context if
        conventions changed.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create module structure and verify expected files are present

      ## 2. Core Implementation

      - [ ] 2.1 Implement export function and verify the export test passes

      ## 3. Observability

      - [ ] 3.1 Add `export` logger with entry/exit/error lines; verify they appear in a manual run

      ## 4. Tests

      - [ ] 4.1 Add unit tests for scenarios in specs/data-export; verify suite green

      ## 5. Docs

      - [ ] 5.1 Finalize doc/data-export.md and update doc/README.md index
      ```
    requires:
      - specs
      - design

  - id: test-plan
    generates: test-plan.md
    description: Test cases to pass before the change can be closed, with the tool used to run each one
    template: test-plan.md
    instruction: |
      Create the test plan: the concrete evidence required before this change
      can be closed and archived. It is executed in the `test` phase and every
      row must end in `pass` before the human review gate.

      Derive cases from the spec scenarios (each scenario → at least one case)
      and from the user stories' acceptance criteria. Read specs/**/*.md and
      tasks.md from disk first.

      Sections:
      - **Automated tests**: which test files/suites cover which scenarios, and
        the exact command that runs them (e.g. `npm test`, `pytest -q`). These
        run first and must be green.
      - **Interactive cases**: a table `| ID | Scenario | Steps | Expected | Tool | Result |`.
        Pick the tool by app type and be explicit, because the agent running
        the plan will use it:
        - `playwright` - web UI flows via the Playwright MCP (navigate, click, fill, assert, screenshot)
        - `chrome` - web UI via the Claude Chrome extension when a real logged-in browser session or DevTools/console reading is needed
        - `http` - APIs/services via curl or httpie, asserting status/body and checking the server log
        - `console` - CLIs, scripts, workers: run the command, assert stdout/exit code/log file
        - `manual` - only for things no tool can drive (hardware, third-party UIs); these are for the human reviewer
        Result starts as `todo` and becomes `pass` / `fail (note)` when executed.
      - **Observability checks**: log lines, metrics, or trace ids that must be
        visible during the cases above (e.g. "`task.create` INFO line with id
        and duration_ms"). Debuggability is a deliverable, so it is tested too.
      - **Exit criteria**: what "done" means for this change (all automated
        green, all interactive rows pass, observability checks visible, no
        known regressions).

      Keep the plan proportional: a scaffolding epic may have three console
      cases; a user-facing feature will have many. Don't pad.
    requires:
      - specs
      - tasks

apply:
  requires: [tasks, test-plan]
  tracks: tasks.md
  instruction: |
    Implement the change on its own git branch (`epic/<change-name>`), never on
    main. Work through pending tasks in order, mark each `- [x]` as it lands,
    and commit per task group with the change name as the conventional-commit
    scope. Follow the Observability section of design.md while writing code -
    logging is part of the implementation, not a cleanup step. When all tasks
    are checked, run test-plan.md before asking for human review. Pause if you
    hit blockers or need clarification.
